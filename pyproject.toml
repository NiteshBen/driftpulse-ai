[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driftpulse-ai"
version = "1.0.0"
description = "Production Data Drift, Concept Drift & Statistical Degradation Sentinel for ML & LLM Pipelines"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Nitesh Beniwal", email = "niteshben01@gmail.com" }
]
keywords = [
    "data-drift",
    "concept-drift",
    "mlops",
    "llmops",
    "machine-learning",
    "data-science",
    "statistics",
    "ks-test",
    "population-stability-index",
    "wasserstein",
    "power-bi",
    "monitoring"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
data = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
]

[project.scripts]
driftpulse = "driftpulse.cli.main:main"

[project.urls]
Homepage = "https://github.com/NiteshBen/driftpulse-ai"
Repository = "https://github.com/NiteshBen/driftpulse-ai"
Issues = "https://github.com/NiteshBen/driftpulse-ai/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["driftpulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
